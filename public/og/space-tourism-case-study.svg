<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Space Tourism case study</title>
  <desc id="desc">Annotated case study cover for Space Tourism with an orbital line drawing and the project tagline.</desc>
  <rect width="1200" height="630" fill="#f4efe7"/>
  <rect x="42" y="42" width="1116" height="546" rx="24" fill="#fbfaf7" stroke="#111111" stroke-width="4"/>
  <g transform="translate(100 115) scale(0.75)" fill="none" stroke="#111111" stroke-width="5">
    <circle cx="200" cy="200" r="100"/>
    <ellipse cx="200" cy="200" rx="176" ry="62" transform="rotate(-35 200 200)"/>
    <ellipse cx="200" cy="200" rx="148" ry="45" transform="rotate(-35 200 200)"/>
    <path d="M100 200h200 M104 175h192 M113 150h174 M134 125h132 M104 225h192 M113 250h174 M134 275h132"/>
    <circle cx="337" cy="116" r="9" fill="#111111" stroke="none"/>
  </g>
  <text x="610" y="190" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#111111">Annotated case study</text>
