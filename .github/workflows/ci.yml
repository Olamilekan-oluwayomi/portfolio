name: Foundation checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm run typecheck
      - name: Check mobile performance budgets
        run: npm run check:performance
      - name: Keep Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-${{ github.event_name }}-${{ github.run_id }}
          path: |
            .lighthouseci/
            artifacts/lighthouse/
          if-no-files-found: warn
          retention-days: 14
