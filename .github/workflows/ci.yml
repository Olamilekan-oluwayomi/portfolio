name: Foundation checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm run typecheck

      - run: npx playwright install --with-deps chromium
      - run: npm run test:launch
      - run: npm run audit:performance
      - name: Upload launch audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: launch-audits
          path: |
            artifacts/launch/
            docs/launch-performance-results.json
            test-results/
