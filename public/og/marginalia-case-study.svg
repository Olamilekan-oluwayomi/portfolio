<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Marginalia case study</title>
  <desc id="desc">Annotated case study cover for Marginalia with a tilted manuscript sheet and the project tagline.</desc>
  <rect width="1200" height="630" fill="#f4efe7"/>
  <rect x="42" y="42" width="1116" height="546" rx="24" fill="#fbfaf7" stroke="#111111" stroke-width="4"/>
  <g transform="rotate(-7 300 320)">
    <rect x="152" y="150" width="296" height="340" fill="#ffffff" stroke="#111111" stroke-width="4"/>
    <text x="300" y="188" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#111111">Research / Reading / Sources</text>
    <path d="M180 204H420" stroke="#111111" stroke-width="2"/>
    <text x="286" y="386" text-anchor="middle" font-family="Georgia, serif" font-size="150" font-weight="700" fill="#111111">M</text>
    <text x="352" y="320" font-family="Georgia, serif" font-size="58" font-weight="700" fill="#111111">*</text>
    <path d="M180 424H420" stroke="#111111" stroke-width="2"/>
    <text x="300" y="460" text-anchor="middle" font-family="Georgia, serif" font-size="26" fill="#111111">Marginalia</text>
  </g>
  <text x="128" y="340" font-family="Georgia, serif" font-size="64" fill="#111111">[</text>
  <text x="466" y="340" font-family="Georgia, serif" font-size="64" fill="#111111">]</text>
  <text x="610" y="190" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#111111">Annotated case study</text>
  <text x="610" y="280" font-family="Arial, sans-serif" font-size="64" font-weight="700" fill="#111111">Marginalia</text>
  <text x="610" y="360" font-family="Arial, sans-serif" font-size="32" fill="#444444">An assistant where every claim</text>
  <text x="610" y="410" font-family="Arial, sans-serif" font-size="32" fill="#444444">keeps its source attached.</text>
  <text x="610" y="500" font-family="Arial, sans-serif" font-size="24" fill="#111111">Built independently by Olamilekan Ilesanmi</text>
  <text x="610" y="542" font-family="Arial, sans-serif" font-size="22" fill="#666666">2026</text>
</svg>
